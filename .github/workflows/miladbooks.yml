name: MiladBooks
on:
  push:
    paths: ['projects/miladbooks/**', '.github/workflows/miladbooks.yml']
  pull_request:
    paths: ['projects/miladbooks/**', '.github/workflows/miladbooks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/miladbooks
    env:
      DB_PASSWORD: ci-only-password
      COMPOSE_PROJECT_NAME: miladbooks-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/miladbooks/backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: projects/miladbooks/backend
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python -m unittest discover -s backend/tests -p test_stack.py -v
        env:
          STACK_URL: http://127.0.0.1:8080
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
