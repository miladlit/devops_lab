services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=milad
      - DB_PASSWORD=example
      - DB_NAME=miladbooks
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: milad
      POSTGRES_PASSWORD: example
      POSTGRES_DB: miladbooks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
